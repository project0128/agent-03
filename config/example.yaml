# 03 (agent-03) 配置示例
# 复制为 config.yaml 后修改，本地覆盖请用 config.local.yaml（不进仓库）

# 模型配置
model:
  name: "qwen2.5:7b"
  provider: "ollama"
  base_url: "http://localhost:11434"
  temperature: 0.7
  max_tokens: 2048

# 记忆配置
memory:
  max_short_term: 20
  max_long_term: 1000
  compression_threshold: 50
  decay_rate: 0.01
  storage_path: "./data/memories"

# 沙箱配置
sandbox:
  enabled: true
  image: "agent-03-sandbox:latest"
  memory_limit: "512m"
  cpu_limit: "1.0"
  network: "none"

# 日志配置
logging:
  level: "info"
  path: "./data/logs"
  max_size_mb: 100
  backup_count: 5

# 自我进化配置
evolution:
  enabled: true
  max_attempts_per_day: 50
  eval_repeat: 3
  spread_tolerance: 0.05
  auto_rollback: true
